services:
  - type: web
    name: bettertomorrow-api
    env: node
    plan: starter
    rootDir: better-tomorrow-school/server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bettertomorrow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bettertomorrowschool.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "500"
      - key: SCHOOL_NAME
        value: Better Tomorrow School
      - key: SCHOOL_EMAIL
        value: info@bettertomorrowschool.com
      - key: SCHOOL_PHONE
        value: +254725839099

databases:
  - name: bettertomorrow-db
    plan: starter
    databaseName: bettertomorrow
    user: bettertomorrow_user